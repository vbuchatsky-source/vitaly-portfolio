<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EngUp · Vitaly Buchatsky · Mechanical &amp; Systems Engineer</title>
<meta name="description" content="EngUp — Vitaly Buchatsky, mechanical &amp; systems engineer. 15+ years of electromechanical medical device R&amp;D and NPI. Interactive engineering simulators and design portfolio.">
<meta name="theme-color" content="#05070A"><link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Rubik:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070A;--p:#0B1016;--ln:#1A2430;--tx:#C9D4DF;--hi:#F2F6FA;--mu:#6E7F90;--ac:#38E1FF;--or:#FF6B1A;--m:'JetBrains Mono',monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Inter,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(#38e1ff0b 1px,transparent 1px),linear-gradient(90deg,#38e1ff0b 1px,transparent 1px),linear-gradient(#38e1ff05 1px,transparent 1px),linear-gradient(90deg,#38e1ff05 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#fff0 0 3px,#ffffff04 3px 4px)}
main,nav,footer{position:relative;z-index:1}
h1,h2,h3{font-family:Rubik,sans-serif;color:var(--hi);margin:0}a{color:var(--ac)}
.m{font-family:var(--m);letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--mu)}
.w{max-width:1160px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;background:#05070acc;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);z-index:9}
nav .w{display:flex;justify-content:space-between;align-items:center;height:60px}
nav img{height:28px;display:block}nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0}
nav ul a{color:var(--tx);text-decoration:none;font-family:var(--m);font-size:12px;letter-spacing:.1em}nav ul a:hover{color:var(--ac)}
.st{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:#3dff9a;box-shadow:0 0 8px #3dff9a;animation:bl 2s infinite}@keyframes bl{50%{opacity:.3}}
.hero{padding:70px 0 40px;position:relative;min-height:88vh;display:flex;align-items:center}
.hg{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(42px,8vw,86px);line-height:1.02;letter-spacing:-.01em;margin:18px 0}
.hero h1 em{font-style:normal;display:block;font-size:.42em;font-weight:600;color:var(--ac);font-family:var(--m);letter-spacing:.04em;margin-top:12px;}
.lead{font-size:clamp(17px,2vw,20px);font-weight:300;max-width:620px;color:var(--tx)}
.lead b{color:var(--hi);font-weight:500}
.btn{display:inline-flex;gap:10px;align-items:center;padding:13px 22px;font:600 13px var(--m);letter-spacing:.1em;text-decoration:none;border:1px solid var(--ac);color:var(--bg);background:var(--ac);margin:8px 10px 0 0;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:.25s}
.btn:hover{box-shadow:0 0 30px #38e1ff66;transform:translateY(-2px)}.btn.o{background:transparent;color:var(--ac)}
.hud{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin:auto}
.hud svg{width:100%;height:100%;overflow:visible}.rot{transform-origin:200px 200px;animation:r 40s linear infinite}.rot2{transform-origin:200px 200px;animation:r 22s linear infinite reverse}@keyframes r{to{transform:rotate(360deg)}}
.corner{position:absolute;width:16px;height:16px;border:1px solid var(--ac)}.c1{top:0;right:0;border-width:1px 1px 0 0}.c2{top:0;left:0;border-width:1px 0 0 1px}.c3{bottom:0;right:0;border-width:0 1px 1px 0}.c4{bottom:0;left:0;border-width:0 0 1px 1px}
.tel{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);background:#0b1016cc;margin-top:50px}
.tel div{padding:18px 20px;border-right:1px solid var(--ln);min-width:0}.tel div:last-child{border-right:0}.tel .m{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tel b{display:block;font:600 clamp(24px,3.4vw,38px) var(--m);color:var(--hi)}.tel b i{font-style:normal;color:var(--ac)}
section{padding:90px 0;border-top:1px solid var(--ln)}
.sh{display:flex;align-items:baseline;gap:16px;margin-bottom:12px;flex-wrap:wrap}.sh .m{color:var(--ac);font-size:13px}
h2{font-size:clamp(28px,4.5vw,44px)}.sub{color:var(--mu);margin:0 0 40px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.card{background:var(--p);border:1px solid var(--ln);display:flex;flex-direction:column;position:relative;transition:.35s}
.card:hover{border-color:var(--c);transform:translateY(-6px);box-shadow:0 20px 60px -20px var(--c)}
.ch{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ln)}.ch .m{font-size:11px}.ch .m:first-child{color:var(--c)}
.card .im{display:block;position:relative;overflow:hidden;border-bottom:1px solid var(--ln)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block;filter:saturate(.85) contrast(1.05);transition:.6s}.card:hover img{transform:scale(1.05);filter:none}
.card .im:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#0b1016)}
.cb{padding:20px;display:flex;flex-direction:column;flex:1}.card h3{font-size:22px;margin:4px 0 8px}.card p{flex:1;margin:0 0 18px;font-size:15px;font-weight:300}
.card .btn{align-self:flex-start;margin:0;background:transparent;color:var(--c);border-color:var(--c)}.card .btn:hover{background:var(--c);color:var(--bg)}
.add{border:1px dashed var(--ln);display:flex;align-items:center;justify-content:center;min-height:200px;text-align:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:50px}
.spec{border:1px solid var(--ln);background:var(--p)}.spec div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--ln)}.spec div:last-child{border:0}
.spec span:last-child{color:var(--hi);text-align:right}
.tl{position:relative;padding-left:24px;border-left:1px solid var(--ln)}
.tl div{position:relative;margin-bottom:26px}.tl div:before{content:"";position:absolute;left:-29px;top:8px;width:9px;height:9px;background:var(--bg);border:1px solid var(--ac);transform:rotate(45deg)}
.tl div:first-child:before{background:var(--ac);box-shadow:0 0 12px var(--ac)}
.tl b{color:var(--hi);font-size:18px;font-family:Rubik}.tl .m{display:block}
.ct a{display:flex;justify-content:space-between;align-items:center;padding:20px;border:1px solid var(--ln);background:var(--p);color:var(--hi);text-decoration:none;margin-bottom:12px;transition:.25s;font-family:var(--m);font-size:15px}
.ct a:hover{border-color:var(--ac);color:var(--ac)}
footer{border-top:1px solid var(--ln);padding:26px 0}footer .w{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}

.mb{display:none;background:none;border:1px solid var(--ln);color:var(--ac);width:40px;height:40px;cursor:pointer;font:600 18px var(--m)}
.dg{margin-bottom:56px;border:1px solid var(--ln);background:#0b1016cc}
.dgh{display:grid;grid-template-columns:1.2fr 1fr;gap:0;border-bottom:1px solid var(--ln)}
.dgh>div{padding:22px 24px}.dgh>div+div{border-left:1px solid var(--ln)}
.dgh h3{font-size:clamp(20px,2.6vw,28px);margin:6px 0 10px}.dgh p{margin:0;font-weight:300;font-size:15px}
.dgh .id{color:var(--c)}.dgh .spec{border:0;background:none}.dgh .spec div{padding:9px 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px;background:#070a0e;grid-auto-flow:dense}
.gal button{all:unset;cursor:zoom-in;position:relative;background:#070a0e;aspect-ratio:4/3;overflow:hidden;display:block}
.gal button:first-child{grid-column:span 2;grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:.6s;filter:saturate(.9)}
.gal button:hover img,.gal button:focus-visible img{transform:scale(1.06);filter:none}
.gal button:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.gal span{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,#05070Aee);font:11px var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--tx)}
.lb{position:fixed;inset:0;z-index:100;background:#03050Af2;display:none;align-items:center;justify-content:center;flex-direction:column;padding:56px 16px 20px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;border:1px solid var(--ln)}
.lb p{margin:12px 0 0;text-align:center}.lb button{position:absolute;background:#0b1016;border:1px solid var(--ln);color:var(--ac);width:46px;height:46px;font:20px var(--m);cursor:pointer}
.lb .x{top:10px;right:10px}.lb .pv{left:10px;top:50%}.lb .nx{right:10px;top:50%}
@media(max-width:820px){.mb{display:block}nav .st{display:none}nav ul.op{display:flex;position:absolute;top:60px;left:0;right:0;flex-direction:column;gap:0;background:#05070Af5;border-bottom:1px solid var(--ln)}nav ul.op a{display:block;padding:16px 20px;border-top:1px solid var(--ln)}.dgh{grid-template-columns:1fr}.dgh>div+div{border-left:0;border-top:1px solid var(--ln)}.gal{grid-template-columns:1fr 1fr}.lb .pv,.lb .nx{top:auto;bottom:14px}.hg,.cols{grid-template-columns:1fr}.hud{max-width:300px;order:-1}.hero{min-height:0;padding-top:40px}nav ul{display:none}.tel{grid-template-columns:1fr 1fr}.tel div:nth-child(2){border-right:0}.tel div:nth-child(-n+2){border-bottom:1px solid var(--ln)}.tel div{padding:14px}.tel .m{font-size:10px;letter-spacing:.04em}.grid{grid-template-columns:1fr}section{padding:64px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
.tl ul{margin:8px 0 0;padding:0;list-style:none}.tl li{font-size:14.5px;font-weight:300;color:var(--tx);padding-left:16px;position:relative;margin:3px 0}.tl li:before{content:"";position:absolute;left:0;top:11px;width:8px;height:1px;background:var(--ac)}
.dm{display:block;font:500 11px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin-top:2px}
.skb{border:1px solid var(--ln);background:var(--p);margin-top:22px;padding:6px 0 12px}.skb h4{margin:0;padding:10px 16px;border-bottom:1px solid var(--ln);color:var(--ac)}
.bar{padding:10px 16px 0}.bar div{display:flex;justify-content:space-between;font-size:14px}.bar div span:last-child{font-family:var(--m);color:var(--hi)}
.bar s{display:block;height:3px;background:var(--ln);margin-top:7px;text-decoration:none}.bar s i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#9feeff);width:0;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}.skb.in .bar s i{width:var(--v)}
.rm{margin-top:14px;font-size:15px;font-weight:300}.rm summary{cursor:pointer;color:var(--ac);font:600 12px var(--m);letter-spacing:.12em;text-transform:uppercase;list-style:none}.rm h4{color:var(--hi);margin:14px 0 2px;font-family:'Space Grotesk',Rubik,sans-serif;font-size:16px}.rm p{margin:0}
.sh{display:block!important}.sh .m{display:block;margin-bottom:10px;letter-spacing:.18em}
</style><style>.ph{padding:50px 0 30px}.back{font:600 12px var(--m);letter-spacing:.14em;text-decoration:none;color:var(--ac)}.ph h1{font-size:clamp(32px,5.5vw,60px);line-height:1.05;margin:16px 0 14px}
.hero2{border:1px solid var(--ln);margin:10px 0 40px;background:#0d141b}.hero2 img{width:100%;max-height:72vh;object-fit:contain;display:block;cursor:zoom-in}
.pg{display:grid;grid-template-columns:1.3fr .7fr;gap:44px;margin-bottom:56px}.pg p.ld{font-size:18px;font-weight:300;margin:0}
.wu h3{font-size:18px;margin:26px 0 6px}.wu p{margin:0;font-weight:300}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding-bottom:90px}.gl button{padding:0;border:1px solid var(--ln);background:#0d141b;cursor:zoom-in;aspect-ratio:4/3;overflow:hidden;position:relative}.gl img{width:100%;height:100%;object-fit:cover;display:block;transition:.6s}.gl button:hover img{transform:scale(1.05)}.gl button:hover{border-color:var(--ac)}
.gl span{position:absolute;left:8px;bottom:8px;background:#05070acc;padding:3px 8px;font:500 10.5px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--tx)}
.nxp{display:flex;justify-content:space-between;border-top:1px solid var(--ln);padding:26px 0 60px;gap:12px}.nxp a{text-decoration:none;font:600 12px var(--m);letter-spacing:.12em;text-transform:uppercase}
@media(max-width:820px){.pg{grid-template-columns:1fr;gap:26px}.gl{grid-template-columns:1fr 1fr;gap:8px}}</style></head><body>
<nav><div class="w"><a href="index.html"><img src="logo.svg" alt="EngUp"></a><ul id="nm"><li><a href="index.html#projects">Simulators</a></li><li><a href="index.html#designs">Projects</a></li><li><a href="index.html#about">About</a></li><li><a href="index.html#contact">Contact</a></li></ul><span class="st m"><i class="dot"></i>SYS ONLINE</span><button class="mb" id="mb" aria-label="Menu" aria-expanded="false" aria-controls="nm">☰</button></div></nav>
<main><div class="w" id="pv"></div></main>
<footer><div class="w"><span class="m">© 2026 EngUp · Vitaly Buchatsky</span><span class="m">Mechanical &amp; Systems Engineer</span></div></footer>
<script src="designs.js"></script><script>
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=new URLSearchParams(location.search).get('id');let ix=DESIGNS.findIndex(x=>x.id===id);if(ix<0)ix=0;const d=DESIGNS[ix];
document.title=d.title+' · EngUp · Vitaly Buchatsky';
const FLAT=d.imgs.map(([f,c],j)=>({f,c:`${j+1} / ${d.imgs.length}${c?' — '+c:''}`,t:d.title}));
const pr=DESIGNS[(ix-1+DESIGNS.length)%DESIGNS.length],nx=DESIGNS[(ix+1)%DESIGNS.length];
document.getElementById('pv').innerHTML=`<div class="ph"><a class="back" href="index.html#designs">‹ Back to projects</a><div class="m" style="color:${d.color};margin-top:26px;white-space:normal">${esc(d.tag)}</div><h1>${esc(d.title)}</h1></div>
<div class="hero2" id="gl"><button data-i="0" style="all:unset;display:block;width:100%"><img src="img/designs/${d.imgs[0][0]}.jpg" alt="${esc(d.title)}"></button></div>
<div class="pg"><div><p class="ld">${esc(d.desc)}</p>${d.more?`<div class="wu">${d.more.map(([h,t])=>`<h3>${esc(h)}</h3><p>${esc(t)}</p>`).join('')}</div>`:''}</div>
<div class="spec">${d.spec.map(([k,v])=>`<div><span class="m">${k}</span><span>${esc(v)}</span></div>`).join('')}<div><span class="m">Images</span><span>${d.imgs.length}</span></div></div></div>
${d.imgs.length>1?`<div class="sh"><span class="m">Gallery</span></div><div class="gl" id="gl2">${d.imgs.map(([f,c],j)=>`<button data-i="${j}" aria-label="Image ${j+1}"><img src="img/designs/thumb/${f}.jpg" alt="${esc(d.title)}${c?' — '+esc(c):''}" loading="lazy">${c?`<span>${esc(c)}</span>`:''}</button>`).join('')}</div>`:''}
<div class="nxp"><a href="project.html?id=${pr.id}">‹ ${esc(pr.title)}</a><a href="project.html?id=${nx.id}">${esc(nx.title)} ›</a></div>`;
const lb=document.createElement('div');lb.className='lb';lb.setAttribute('role','dialog');lb.innerHTML='<button class="x" aria-label="Close">✕</button><button class="pv" aria-label="Previous">‹</button><img alt=""><p class="m"></p><button class="nx" aria-label="Next">›</button>';document.body.appendChild(lb);
let cur=0;const show=i=>{cur=(i+FLAT.length)%FLAT.length;const x=FLAT[cur];lb.querySelector('img').src=`img/designs/${x.f}.jpg`;lb.querySelector('img').alt=x.t;lb.querySelector('p').textContent=x.t+' · '+x.c;lb.classList.add('on');document.body.style.overflow='hidden'};
const hide=()=>{lb.classList.remove('on');document.body.style.overflow=''};
document.getElementById('gl').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i)});
lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('x'))hide();else if(e.target.classList.contains('pv'))show(cur-1);else if(e.target.classList.contains('nx'))show(cur+1)});
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')hide();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
let tx=0;lb.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(cur+(d<0?1:-1))});
document.getElementById('gl2')?.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i)});
const mb=document.getElementById('mb'),nm=document.getElementById('nm');mb.onclick=()=>{const o=nm.classList.toggle('op');mb.setAttribute('aria-expanded',o);mb.textContent=o?'✕':'☰'};nm.addEventListener('click',e=>{if(e.target.tagName==='A'){nm.classList.remove('op');mb.textContent='☰';mb.setAttribute('aria-expanded',false)}});
</script></body></html>
